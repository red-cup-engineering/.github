{
  "name": "Agent work",
  "description": "Continue original service work with exact sources, a receiving owner and honest evidence.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use the existing Work or issue when one exists. This form is a GitHub interface to service work; it does not admit a native Work/Cell, grant authority, or qualify a merge. Do not include credentials or private raw logs. A qualified source handoff belongs in an authenticated comment on its original ready PR, not in this issue body."
      }
    },
    {
      "type": "textarea",
      "id": "work-and-owners",
      "attributes": {
        "label": "Original work and owners",
        "description": "Link the original Work/issue and governing requirement. Name the implementing services section/proper repository and ordinary receiving owner. Say unknown where not yet established; do not invent a new Work identity."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "outcome-and-consumer",
      "attributes": {
        "label": "Needed outcome and ordinary consumer",
        "description": "What capability or data must reach which real consumer? State its conditions of satisfaction and capabilities that must be preserved."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "exact-source",
      "attributes": {
        "label": "Exact source and related work",
        "description": "Give repository URLs/IDs, branches and immutable commits/paths. Link relevant PRs, variants and dependencies; distinguish current source from historical provenance."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence-and-unknowns",
      "attributes": {
        "label": "Receiving evidence and unknowns",
        "description": "Link exact evidence and identify what actually ran or was independently received. Keep source tests, published artifacts, installation and useful operation distinct. Record missing evidence, refusals and unresolved obligations."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "next-action",
      "attributes": {
        "label": "Next action and dependencies",
        "description": "Name the next concrete change and its owner, prerequisites and original return/receiving route. This request does not supply approval, actor authority, credentials or a budget."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
